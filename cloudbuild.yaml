# Cloud Build pipeline — triggered on push to main branch
# Required substitutions (set in Cloud Build trigger or pass via --substitutions):
#   _REGION           : e.g. europe-west1
#   _SERVICE_NAME     : e.g. transcription-platform
#   _WHISPER_MODEL    : tiny | base | small | medium | large-v3

substitutions:
  _REGION: europe-west1
  _SERVICE_NAME: transcription-platform
  _WHISPER_MODEL: medium

steps:
  # 1. Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    id: build
    args:
      - build
      - "--build-arg=WHISPER_MODEL=${_WHISPER_MODEL}"
      - "--tag=europe-docker.pkg.dev/$PROJECT_ID/transcription/${_SERVICE_NAME}:$SHORT_SHA"
      - "--tag=europe-docker.pkg.dev/$PROJECT_ID/transcription/${_SERVICE_NAME}:latest"
      - "--cache-from=europe-docker.pkg.dev/$PROJECT_ID/transcription/${_SERVICE_NAME}:latest"
      - .

  # 2. Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: push
    args:
      - push
      - "--all-tags"
      - "europe-docker.pkg.dev/$PROJECT_ID/transcription/${_SERVICE_NAME}"

  # 3. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - "--image=europe-docker.pkg.dev/$PROJECT_ID/transcription/${_SERVICE_NAME}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--port=8501"
      - "--memory=4Gi"
      - "--cpu=2"
      - "--timeout=3600"
      - "--concurrency=5"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--no-allow-unauthenticated"
      - "--set-env-vars=WHISPER_MODEL=${_WHISPER_MODEL},IAP_ENABLED=true"
      - "--set-secrets=GOOGLE_CLIENT_ID=transcription-google-client-id:latest,GOOGLE_CLIENT_SECRET=transcription-google-client-secret:latest"

images:
  - "europe-docker.pkg.dev/$PROJECT_ID/transcription/${_SERVICE_NAME}:$SHORT_SHA"
  - "europe-docker.pkg.dev/$PROJECT_ID/transcription/${_SERVICE_NAME}:latest"

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

timeout: "1800s"
