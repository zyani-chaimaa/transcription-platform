services:
  app:
    build:
      context: .
      args:
        WHISPER_MODEL: medium
    image: transcription-platform:local
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Override any .env value for local dev here
      REDIRECT_URI: http://localhost:8501
      IAP_ENABLED: "false"
    volumes:
      # Mount source for hot-reload during development
      - ./app.py:/app/app.py
      - ./src:/app/src
      # Persist downloaded model across container rebuilds
      - whisper_model_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  whisper_model_cache:
